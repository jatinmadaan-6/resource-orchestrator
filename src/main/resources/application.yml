spring:
  application:
    name: resource-orchestrator
  datasource:
    url: jdbc:h2:mem:orchestrator;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false          # DB sessions never leak into the web layer
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  policy:
    max-unit-cost: 5000          # items above this need the procurement process

springdoc:
  swagger-ui:
    path: /swagger-ui.html
